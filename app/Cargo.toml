[package]
name = "totpvault"
version = "2.0.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "web_screen_reader", "glow", "x11"] }
fs2 = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
totpvault-i18n = { version = "2.0.0", path = "../crates/i18n" }
totpvault-qrimg = { version = "2.0.0", path = "../crates/qrimg" }
totpvault-totp = { version = "2.0.0", path = "../crates/totp" }
totpvault-vault = { version = "2.0.0", path = "../crates/vault" }
