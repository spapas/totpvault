name: Rust port — build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux GUI libraries (eframe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev libegl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Format check
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
      - name: Static checks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Vulnerability audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Release build
        run: cargo build --locked --release -p totpvault-rs
      - uses: actions/upload-artifact@v4
        with:
          name: totpvault-rs-${{ runner.os }}-amd64
          path: |
            rust/target/release/totpvault-rs
            rust/target/release/totpvault-rs.exe
          if-no-files-found: error
