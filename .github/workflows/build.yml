name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    env:
      GOFLAGS: -trimpath
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/build.yml
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Go dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Tests with race detector
        run: go test -race ./...
      - name: Static checks
        run: go vet -v ./...
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Build Linux
        if: runner.os == 'Linux'
        run: go build -v -trimpath -ldflags="-s -w" -o dist/totpvault ./cmd/totpvault
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set CGO_ENABLED=1
          go build -v -trimpath -ldflags="-s -w -H=windowsgui" -o dist\totpvault.exe ./cmd/totpvault
      - uses: actions/upload-artifact@v4
        with:
          name: totpvault-${{ runner.os }}-amd64
          path: dist/totpvault*
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Select version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag must match VERSION'; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --json isDraft > existing-release.json 2> release-error.txt; then
            if [[ "$(jq -r .isDraft existing-release.json)" == false ]]; then
              echo "Release $TAG already published; leaving it unchanged."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -qi 'not found\|HTTP 404' release-error.txt; then
            cat release-error.txt; exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: totpvault-*-amd64
          path: release-input
      - name: Package binaries and checksums
        if: steps.version.outputs.publish == 'true'
        run: python3 scripts/package_release.py release-input release-assets
      - name: Publish release with both platforms
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Offline TOTP authenticator for Windows and Linux (x86-64).

          - **Windows:** extract the Windows ZIP and run `totpvault.exe`.
          - **Linux:** extract the Linux tar.gz and run `./totpvault` on an OpenGL-capable desktop.
          - `SHA256SUMS` contains checksums for both downloads.

          The archives include the license, usage instructions and security notes.
          NOTES
          if ! gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "TOTP Vault $RELEASE_TAG" --notes-file release-notes.md
          fi
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
