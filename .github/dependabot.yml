# Dependency updates as PRs; CI gates every one (fmt, test, clippy, audit, deny).
version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types: ['patch']
      minor:
        applies-to: version-updates
        update-types: ['minor']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
